# vlbaweather: serve the generated VLBA antenna weather page at /vlbaweather/ on this host
#
# Template file: __OUT_DIR__ is the generator's output directory. deploy/install-cron.sh
# (cron, e.g. Gentoo/OpenRC) and deploy/install.sh (systemd) render a copy with the real path
# to /etc/vlbaweather/apache-vlbaweather.conf and print where to copy it; neither edits the
# Apache configuration itself. It sits beside local-weather-awareness's snippet (/myweather/)
# when a host runs both: a separate Alias and directory.
#
# Where it goes (a file included at server level applies to every virtual host, the TLS
# one included; placing these lines inside the site's <VirtualHost *:443> works too):
#   Gentoo:          cp /etc/vlbaweather/apache-vlbaweather.conf /etc/apache2/vhosts.d/vlbaweather.conf
#                    (httpd.conf includes vhosts.d/*.conf; verify on the host)
#                    /etc/init.d/apache2 configtest && rc-service apache2 reload
#   Debian/Ubuntu:   a2enmod headers
#                    cp /etc/vlbaweather/apache-vlbaweather.conf /etc/apache2/conf-available/vlbaweather.conf
#                    a2enconf vlbaweather && apache2ctl configtest && systemctl reload apache2
#   RHEL/Alma/Rocky: cp /etc/vlbaweather/apache-vlbaweather.conf /etc/httpd/conf.d/vlbaweather.conf
#                    apachectl configtest && systemctl reload httpd
#
# Modules: mod_alias (Alias, RedirectMatch) and mod_authz_core (Require) are in every stock
# build. mod_headers sets the Cache-Control and security headers below; they sit inside
# <IfModule mod_headers.c>, so a server without it still starts and serves the page, just
# without those headers. Check with
# "apache2ctl -M | grep -E 'alias|headers'" (Gentoo builds modules from APACHE2_MODULES in
# /etc/portage/make.conf; "headers" and "alias" are in the default set; verify on the host).
#
# The Alias: when the output directory is <DocumentRoot>/vlbaweather (Gentoo's default
# DocumentRoot is /var/www/localhost/htdocs, Debian's and RHEL's /var/www/html) the page is
# already reachable as /vlbaweather/ and the Alias is UNNECESSARY, but harmless: it maps the
# same URL to the same directory. When the output directory lives anywhere else, the Alias is
# what publishes it. Keep the <Directory> block in both cases: it turns off directory
# listings and adds the cache headers.

# /vlbaweather without the slash: redirected here (mod_alias, before the file rules below,
# which would refuse the directory's own name).
RedirectMatch 301 ^/vlbaweather$ /vlbaweather/
Alias /vlbaweather __OUT_DIR__

<Directory "__OUT_DIR__">
    # No listings. The run user owns this directory and the generator never makes links, so a
    # link is served only when it and its target have the same owner (a link planted to a
    # file the run user does not own, e.g. under /etc, is refused). Absolute, not +/-: no
    # ExecCGI or Includes inherited from the server, in a directory the run user can write.
    Options SymLinksIfOwnerMatch
    # Every file is served as it is, never run: a script handler configured server-wide (an
    # AddHandler for .php, say, which also matches x.php.png) does not apply here.
    SetHandler default-handler
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
    # Only what a run writes here is served: index.html, status.json and the radar maps
    # radar_<site>_<theme>.png (no dot inside, so no second extension). Anything else (a
    # cache, state or log file put here by mistake, a temporary file, a script) is refused;
    # "" is the directory itself, which DirectoryIndex then maps to index.html.
    <FilesMatch "^(?!(index\.html|status\.json|radar_[A-Za-z0-9_-]+\.png)?$)">
        Require all denied
    </FilesMatch>
    # The page carries a <meta charset>; this also covers status.json and any stray
    # text file, so the degree signs and middle dots never render as mojibake.
    AddDefaultCharset UTF-8

    # The generator rewrites everything every 30 min (atomically, so a request never sees a
    # half-written file). Short max-age values let browsers and proxies revalidate quickly:
    # the page and its health JSON after 120 s, the radar PNGs (whose URLs already carry a
    # cache-busting ?t=<mtime>) after 120 s.
    <IfModule mod_headers.c>
        <FilesMatch "^(index\.html|status\.json)$">
            Header set Cache-Control "max-age=120"
        </FilesMatch>
        <FilesMatch "\.png$">
            Header set Cache-Control "max-age=120"
        </FilesMatch>
        # A second line behind the page's own escaping. The policy allows what the page loads
        # (vlba/tests/test_fix_deploy.py renders one and checks): its inline <style> and
        # style attributes, its one inline <script>, images from here (the maps), the NWS
        # forecast icons from api.weather.gov and a data: placeholder image; nothing else,
        # no fetch, no frames, no forms. 'unsafe-inline' and not a hash for the script: the
        # script changes with a git pull while this copy is updated by hand, and a blocked
        # script would stop the page's self-reload without a sign. External scripts stay out.
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "no-referrer"
        Header always set Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' https://api.weather.gov data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    </IfModule>
</Directory>
